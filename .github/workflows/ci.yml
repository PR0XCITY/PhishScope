name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Lint
        run: |
          lints <- lintr::lint_dir(".")
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}
      - name: Unit tests
        run: testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)
        shell: Rscript {0}

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node tests
        run: node --test "tests/js/*.test.mjs"
      - name: No HTML injection sinks or eval in web/
        run: |
          if grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|eval\(' web/; then
            echo "Forbidden API found in web/"
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
